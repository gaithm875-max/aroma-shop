<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تحديث الموقع</title>
  <style>body{font-family:Cairo,sans-serif;background:#111;color:#f5f0e8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.card{max-width:520px;padding:20px;border-radius:12px;background:rgba(255,255,255,0.02);text-align:center;border:1px solid rgba(201,163,107,0.12)}</style>
</head>
<body>
  <div class="card">
    <h2>جاري تحديث الموقع…</h2>
    <p id="msg">نقوم بإزالة النسخ المؤقتة من المتصفح ثم نعيد تحميل الصفحة تلقائياً.</p>
    <p style="font-size:13px;margin-top:12px;color:#b0a898">إذا لم يتم التوجيه تلقائياً خلال 8 ثوانٍ، اضغط <a id="go" href="/">هنا</a>.</p>
  </div>
  <script>
    (async function(){
      try{
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for(const r of regs){ try{ await r.unregister(); }catch(e){} }
        }
      }catch(e){}
      // wait a moment then force reload from network
      setTimeout(()=>{
        // add cache-buster
        location.href = '/?v=' + Date.now();
      }, 800);
    })();
  </script>
</body>
</html>
